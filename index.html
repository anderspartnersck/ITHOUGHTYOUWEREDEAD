<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>I THOUGHT YOU WERE DEAD! — a Cleveland Bob story</title>
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');</script>
<style>
  :root{ --gold:#d8a23a; --blood:#b5232b; --ink:#0a0b0f; --bone:#e9e4d6; --dim:#6b6f7a; --viol:#7a4cff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#000; color:var(--bone); overflow:hidden;
    font-family:"Saira Condensed","Oswald",system-ui,sans-serif; letter-spacing:.5px; }
  #cab{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 35%, #14161d 0%, #07080c 60%, #000 100%); }
  #scene{ position:relative; width:min(100vw,56vh*1.6); height:min(100vh,56vw/1.6); max-width:980px; }
  /* ?embed (panel/cab mount): the POV composition is %-positioned, so let #scene fill the
     host rect edge-to-edge — true WIDESCREEN, no letterbox inside the cabinet monitor. */
  html.embed #cab{ background:#000; }
  html.embed #scene{ width:100vw; height:100vh; max-width:none; }
  /* film grain / vignette */
  #scene::after{ content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.7) 100%); }

  /* the man across the street (POV) */
  #man{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); width:34%;
    text-align:center; transition:opacity .25s, filter .25s; }
  #man pre{ font-family:ui-monospace,Menlo,monospace; line-height:1.05; font-size:clamp(10px,2.1vh,20px);
    color:#ddd2ba; text-shadow:0 0 12px rgba(0,0,0,.95), 0 0 22px rgba(120,86,30,.35); white-space:pre; }
  #man.winged pre{ color:#caa; }
  #man.boss pre{ color:#e7c98a; text-shadow:0 0 14px rgba(216,162,58,.4), 0 0 10px rgba(0,0,0,.95); }
  .zone{ position:absolute; left:50%; transform:translateX(-50%); width:74%; border:2px solid transparent;
    border-radius:6px; pointer-events:none; transition:.12s; font-size:clamp(9px,1.5vh,13px);
    color:var(--dim); text-align:right; padding-right:6px; }
  /* TARGET SIZES (0928): the head is SMALL (the gamble), center mass BIG (the sure thing), the wing between.
     A shot outside every zone is WIDE — a miss. */
  #zHEAD{ top:4%; height:16%; width:30%; } #zCENTER{ top:23%; height:40%; width:60%; } #zWING{ top:65%; height:27%; width:74%; }
  /* zones are FITTED to the drawn figure (fitZones); labels only show when the zone is live */
  .zone{ color:transparent; } .zone.aim, .zone.sel, .zone.read, .zone.guard, .zone.shoulder, .zone.open{ color:inherit; }
  .zone.aim{ color:#caa15e; } .zone.sel{ color:var(--gold); } .zone.read{ color:#e88; } .zone.guard{ color:#c77; }
  /* the SHOULDER: late, but it never lies — his gun arm swings to where he'll really shoot */
  .zone.shoulder{ border-left:5px solid #f0d49a; box-shadow:-10px 0 18px -6px rgba(240,212,154,.55); color:#f0d49a; }
  .zone.sel{ border-color:var(--gold); color:var(--gold); box-shadow:0 0 18px rgba(216,162,58,.35) inset; }
  .zone.read{ border-color:var(--blood); color:#e88; box-shadow:0 0 18px rgba(181,35,43,.4) inset; }

  /* your hand / barrel low in frame */
  #hand{ position:absolute; left:50%; bottom:-2%; transform:translateX(-50%);
    font-family:ui-monospace,monospace; color:#3a3d46; font-size:clamp(12px,2.4vh,22px); }

  /* HUD */
  #hud{ position:absolute; top:2.5%; left:3%; right:3%; z-index:6; display:flex; justify-content:space-between;
    font-size:clamp(10px,1.7vh,15px); color:var(--dim); text-transform:uppercase; }
  #hud b{ color:var(--bone); font-weight:700; }
  #poem{ position:absolute; top:7%; left:50%; z-index:6; transform:translateX(-50%); color:var(--gold);
    font-size:clamp(10px,1.7vh,15px); letter-spacing:2px; }

  /* big centered prompt / banners */
  #banner{ position:absolute; left:0; right:0; top:14%; text-align:center; pointer-events:none; }
  #big{ font-weight:900; font-style:italic; font-size:clamp(20px,5.2vh,46px); letter-spacing:1px;
    text-shadow:0 2px 0 #000, 0 0 24px rgba(0,0,0,.8); }
  #sub{ margin-top:.3em; color:var(--dim); font-size:clamp(11px,2vh,18px); }
  .flash{ animation:flash .5s ease; }
  @keyframes flash{ 0%{ filter:brightness(3); } 100%{ filter:none; } }

  /* bottom prompt bar */
  #prompt{ position:absolute; left:50%; transform:translateX(-50%); bottom:5%; text-align:center; z-index:6;
    background:rgba(3,4,7,.72); border-radius:6px; padding:.15em .8em; white-space:nowrap; max-width:96%;
    font-size:clamp(12px,2.3vh,20px); color:var(--bone); min-height:2em; }
  #prompt .k{ display:inline-block; border:1px solid var(--dim); border-radius:4px; padding:0 .4em;
    margin:0 .15em; color:var(--gold); font-size:.85em; }
  #prompt small{ color:var(--dim); }

  /* overlay screens (cold open, story, ending, board) */
  #overlay{ position:absolute; inset:0; background:rgba(3,4,7,.92); display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:6% 8%; gap:.5em; }
  #overlay.show{ display:flex; }
  #overlay h1{ font-size:clamp(22px,6vh,54px); font-weight:900; font-style:italic; color:var(--bone);
    letter-spacing:1px; }
  #overlay .credit{ color:var(--gold); letter-spacing:3px; font-size:clamp(11px,2vh,16px); }
  #overlay p{ color:#b9bcc6; font-size:clamp(12px,2.2vh,18px); max-width:36em; line-height:1.5; }
  #overlay .start{ margin-top:1em; color:var(--gold); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }
  #board{ font-family:ui-monospace,monospace; color:#cdd; font-size:clamp(11px,2vh,16px); line-height:1.6; }
  #board .you{ color:var(--gold); }
  .lethal{ color:var(--blood); } .gold{ color:var(--gold); } .dim{ color:var(--dim); }
  .warm{ color:#e8c98a; } .blood{ color:var(--blood); }
  /* attract: each scene's content rises/fades in fresh on change */
  #overlay.attract > *{ animation: rise 1.1s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  #overlay.attract{ background:#05060b; }
  /* the drop-off montage: hard fast cuts */
  #overlay.cut{ background:#000; }
  #overlay.cut > *{ animation: killcut .12s steps(2) both; }
  @keyframes killcut{ from{ opacity:0; filter:brightness(4); } to{ opacity:1; filter:none; } }
  .kill{ font-weight:900; font-style:italic; font-size:clamp(28px,9vh,80px); color:var(--blood);
    text-shadow:0 0 30px rgba(181,35,43,.5); letter-spacing:1px; }
  .killsub{ color:#6a6a72; letter-spacing:3px; margin-top:.4em; }
  /* THE BUTTON FLIPS — the "DID YOU SEE THAT?" you pressed all game, now mashed by the crowd at Bob */
  #flipbtn{ display:inline-block; font-family:ui-monospace,Menlo,monospace; color:var(--gold);
    font-size:clamp(12px,2.5vh,20px); line-height:1.15; white-space:pre; text-shadow:0 0 14px rgba(216,162,58,.4); }
  #flipbtn.mash{ animation:mash .14s ease; color:var(--blood); text-shadow:0 0 20px var(--blood); }
  @keyframes mash{ 0%{ filter:brightness(4); transform:scale(1.07) translateY(3px); } 100%{ filter:none; transform:none; } }
  #flipcount{ margin-top:.6em; font-weight:900; font-style:italic; letter-spacing:2px; min-height:1.4em; }
  #overlay.roulette{ background:#0c0709; }
  .roul{ font-family:ui-monospace,monospace; color:#cdd; font-size:clamp(13px,2.4vh,20px); line-height:1.25; white-space:pre; }
  .endtitle{ font-size:clamp(26px,8vh,72px); font-weight:900; font-style:italic; color:var(--bone);
    text-shadow:0 0 40px rgba(0,0,0,.9); letter-spacing:1px; }
  #overlay.flashwhite{ animation: whiteflash .5s ease; }
  @keyframes whiteflash{ 0%{ background:#fff; } 100%{ } }
  /* duel FX (Phase 0 ASCII pass) — recoil shake, muzzle-lit gun-hand, the foe drops */
  #man.shake{ animation:shk .2s steps(2) 1; }
  @keyframes shk{ 0%,100%{ transform:translate(-50%,-50%); } 30%{ transform:translate(-53%,-47%); } 70%{ transform:translate(-47%,-53%); } }
  #hand.fire{ color:#ffd24a; text-shadow:0 0 16px #ffae3a, 0 0 34px var(--blood); }
  #man.down pre{ color:var(--blood); }
  #man.down{ animation:drop .45s ease both; }
  @keyframes drop{ from{ transform:translate(-50%,-50%); opacity:1; } to{ transform:translate(-50%,-40%) rotate(3deg); opacity:.82; } }
  /* WINGED (wound): a blood-red flash + recoil — settles to the dim wounded tint, never the drop */
  #man.wound pre{ color:var(--blood); }
  #man.wound{ animation:wound .55s ease both; }
  @keyframes wound{ 0%{ filter:brightness(2.4) saturate(1.5); transform:translate(-50%,-50%); }
    22%{ transform:translate(-46%,-49%) rotate(2.5deg); } 100%{ filter:none; transform:translate(-50%,-50%); } }

  /* ===== ASCII / SPRITE COMBO — the painted MEAN STREETS world behind the ASCII duel.
     The sepia duel illustration sits dimmed as the world (RenCen skyline glowing center,
     the painted duelists as faint ghosts at the edges); the ASCII foe + gun-hand + crowd
     play live on top; painted stills hard-CUT in on the big beats. "kiss of ASCII." ===== */
  #world{ position:absolute; inset:0; z-index:0; overflow:hidden; }
  /* dimmed + blurred HARD so the painted duelists melt into sepia atmosphere — only the
     RenCen skyline glows; the lone ASCII foe reads as the man across the street. */
  #world .bg{ position:absolute; inset:-8%;
    background:url('sprites/cabinet/duel.png') center 34%/cover no-repeat;
    filter:brightness(.2) blur(3px) saturate(.6) contrast(1.1) sepia(.4); transform:scale(1.15); }
  #world .grade{ position:absolute; inset:0; background:
    radial-gradient(120% 90% at 50% 40%, transparent 30%, rgba(5,5,8,.55) 72%, rgba(4,4,6,.9) 100%),
    linear-gradient(180deg, rgba(6,6,9,.6) 0%, rgba(6,6,9,.08) 26%, rgba(6,6,9,.12) 52%, rgba(4,4,6,.9) 100%); }
  /* ASCII crowd — distant spectators framing the street; twinkles, flares gold on a kill */
  #crowd{ position:absolute; left:0; right:0; bottom:7.5%; z-index:1; text-align:center; white-space:nowrap;
    overflow:hidden; font-family:ui-monospace,Menlo,monospace; font-size:clamp(9px,2.1vh,18px); letter-spacing:1px;
    color:#181109; pointer-events:none; opacity:.92; text-shadow:0 1px 1px rgba(0,0,0,.5); }
  #crowd span{ display:inline-block; transition:color .25s ease, transform .2s ease; }
  #crowd span.lit{ color:#3a2c18; }
  #crowd.flare span{ color:#caa15e; transform:translateY(-2px); }
  /* painted sprite STINGER — a full-scene cut on the big beats (duel establish / KILL / President) */
  #sting{ position:absolute; inset:0; z-index:8; width:100%; height:100%; object-fit:cover;
    opacity:0; pointer-events:none; }
  #sting.cut{ animation:stingcut .9s ease forwards; }
  @keyframes stingcut{ 0%{ opacity:0; filter:brightness(3.2) contrast(1.1); }
    11%{ opacity:1; filter:brightness(1.05); } 70%{ opacity:1; } 100%{ opacity:0; } }
  /* BONUS coin-rain — "the crowd throws coins": ASCII tokens tumble over the bonus screen */
  #coinrain{ position:absolute; inset:0; z-index:9; pointer-events:none; overflow:hidden; }
  #coinrain .coin{ position:absolute; top:-12%; font-family:ui-monospace,Menlo,monospace; font-weight:700;
    color:var(--gold); text-shadow:0 0 8px rgba(216,162,58,.6), 0 1px 1px rgba(0,0,0,.7); will-change:transform;
    animation:coinfall linear forwards; }
  @keyframes coinfall{ 0%{ transform:translateY(-14vh) rotate(0deg); opacity:0; }
    9%{ opacity:1; } 88%{ opacity:1; } 100%{ transform:translateY(116vh) rotate(560deg); opacity:.15; } }

  /* ===== LIGHT-PISTOL AIM — Bob's a natural. A crosshair you sweep + squeeze; pointing at
     HEAD courts the headshot (the legend), CENTER is the honest kill, WING just wounds. ===== */
  #aim{ position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; z-index:6; pointer-events:none;
    border:2px solid rgba(216,162,58,.85); border-radius:50%; opacity:0; transition:opacity .15s, filter .12s;
    box-shadow:0 0 10px rgba(216,162,58,.5), inset 0 0 6px rgba(216,162,58,.35); }
  #aim.on{ opacity:.95; }
  #aim.hot{ filter:brightness(1.45) drop-shadow(0 0 6px var(--gold)); }
  #aim::before,#aim::after{ content:""; position:absolute; background:var(--gold); box-shadow:0 0 5px var(--gold); }
  #aim::before{ left:50%; top:-7px; bottom:-7px; width:2px; margin-left:-1px; }
  #aim::after{ top:50%; left:-7px; right:-7px; height:2px; margin-top:-1px; }
  .zone.aim{ border-color:rgba(216,162,58,.55); color:#caa15e; box-shadow:0 0 14px rgba(216,162,58,.18) inset; }
  /* the head-zone glows hotter when the crosshair's on it — the headshot is the call */
  #zHEAD.aim{ border-color:rgba(216,162,58,.9); box-shadow:0 0 22px rgba(216,162,58,.4) inset; }

  /* DEAD-EYE — the headshot pops. Bob can't help it. */
  #deadeye{ position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); z-index:7; text-align:center;
    pointer-events:none; opacity:0; }
  #deadeye .dl{ font-weight:900; font-style:italic; letter-spacing:3px; color:var(--gold);
    font-size:clamp(20px,5vh,44px); text-shadow:0 0 22px var(--gold), 0 2px 0 #000; }
  #deadeye .ds{ color:#e8c98a; letter-spacing:4px; font-size:clamp(11px,2.2vh,17px); margin-top:.15em; }
  #deadeye.pop{ animation:deye 1.05s ease both; }
  @keyframes deye{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-7deg); }
    16%{ opacity:1; transform:translate(-50%,-50%) scale(1.16); }
    30%{ transform:translate(-50%,-50%) scale(1); } 72%{ opacity:1; } 100%{ opacity:0; transform:translate(-50%,-50%) scale(1.02); } }
  #prompt .k{ cursor:pointer; user-select:none; }

  /* ===== THE BODY IS THE INTERFACE (0928) ===== */
  /* his GUARD drifts to your habit — the CPU guards your most-used lane; now you can SEE it */
  .zone.guard{ border:2px dashed rgba(181,35,43,.55); color:#c77; }
  /* the body: a false twitch during "steady…" (a feint — don't bite) */
  #man.twitch{ animation:twitch .22s steps(2) 1; }
  @keyframes twitch{ 0%,100%{ transform:translate(-50%,-50%); } 50%{ transform:translate(-48.5%,-50.6%) rotate(-1.2deg); } }
  /* the stare — he looks straight at Bob */
  #man.stare pre{ color:#f0e6cc; text-shadow:0 0 16px rgba(255,255,255,.25), 0 0 10px rgba(0,0,0,.95); }
  /* the pair (THE SEVEN-JOHNS) — two men side by side */
  #man.pair{ width:62%; }
  /* THE PRESIDENT — the other man in frame (a target you can choose) */
  #pres{ position:absolute; left:80%; top:44%; transform:translate(-50%,-50%); z-index:2; display:none;
    font-family:ui-monospace,Menlo,monospace; white-space:pre; line-height:1.05; font-size:clamp(9px,1.8vh,17px);
    color:#9fb3d9; text-shadow:0 0 12px rgba(0,0,0,.95); cursor:crosshair; }
  #pres.on{ display:block; } #pres.aim{ color:#e7c98a; text-shadow:0 0 16px rgba(216,162,58,.5); }
  #pres.down{ color:var(--blood); transform:translate(-50%,-44%) rotate(4deg); opacity:.8; }
  /* the draw clock — quick-draw sport shows the times */
  #clock{ position:absolute; left:0; right:0; bottom:13%; text-align:center; font-family:ui-monospace,Menlo,monospace;
    font-size:clamp(11px,2vh,17px); color:#b9bcc6; letter-spacing:1px; pointer-events:none; min-height:1.3em; }
  #clock b{ color:var(--gold); } #clock .late{ color:var(--blood); }
  /* WHOA! — time nearly stops; the button lights */
  #scene.slowmo #world .bg{ filter:brightness(.12) blur(4px) saturate(.3) sepia(.6); }
  #scene.slowmo #man pre{ filter:contrast(1.3); }
  #whoabtn{ display:inline-block; font-weight:900; font-style:italic; color:#000; background:var(--gold);
    padding:0 .5em; border-radius:4px; box-shadow:0 0 22px var(--gold); animation:blink .2s steps(1) infinite; }
  /* HEY BOB, SMILE! — the flash, and the afterimage you have to read through */
  #whiteout{ position:absolute; inset:0; z-index:5; pointer-events:none; opacity:0; background:#fff; }
  #whiteout.pop{ animation:whiteout 2.4s ease-out forwards; }
  @keyframes whiteout{ 0%{ opacity:1; } 18%{ opacity:.96; } 55%{ opacity:.55; } 100%{ opacity:.18; } }
  #man.burn pre{ color:#3a2a1a; text-shadow:0 0 30px #fff, 0 0 60px #ffe9b0; filter:blur(1.2px); }
  /* Bob's own wound — the hand shakes and bleeds */
  #hand.hurt{ color:#6a2226; animation:shaky .35s steps(2) infinite; }
  @keyframes shaky{ 0%,100%{ transform:translateX(-50%); } 50%{ transform:translateX(-49%) translateY(1px); } }
  /* LIFE — two pips each. You can't take more than two: a wing takes one, a head or chest takes both. */
  .pips{ letter-spacing:2px; color:var(--gold); } .pips .gone{ color:#3a2020; } .pips.hurt{ color:var(--blood); }
  /* THE GUN-BARREL IRIS — the Bond barrel / the killer-mask POV: it tightens on "steady…" and snaps open on DRAW! */
  @property --iris { syntax:'<percentage>'; inherits:false; initial-value:75%; }
  #iris{ position:absolute; inset:0; z-index:4; pointer-events:none; --iris:75%; opacity:0;
    transition: --iris .55s cubic-bezier(.2,.8,.2,1), opacity .35s;
    background: radial-gradient(circle at 50% 44%, transparent var(--iris), rgba(0,0,0,.94) calc(var(--iris) + 3%)),
      repeating-conic-gradient(from 0deg at 50% 44%, rgba(255,240,210,.045) 0deg 5deg, transparent 5deg 15deg); }
  #iris.tight{ --iris:30%; opacity:1; } #iris.open{ --iris:78%; opacity:.85; transition-duration:.12s; }
  /* CRITICAL — you've been shot once. One more and you're done: the edges throb red, the frame won't sit still,
     and your hand (the sway) never settles. Presentation of the engine's one wound bit. */
  #crit{ position:absolute; inset:0; z-index:4; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse at 50% 45%, transparent 48%, rgba(150,10,18,.55) 82%, rgba(90,0,8,.85) 100%); }
  #scene.critical #crit{ animation:throb 1.05s ease-in-out infinite; }
  @keyframes throb{ 0%,100%{ opacity:.35; } 12%{ opacity:.95; } 24%{ opacity:.5; } 36%{ opacity:.85; } }
  #scene.critical{ animation:critshake 2.6s steps(12) infinite; }
  @keyframes critshake{ 0%,100%{ transform:none; } 20%{ transform:translate(1px,-1px); } 40%{ transform:translate(-1px,1px); }
    60%{ transform:translate(1px,1px); } 80%{ transform:translate(-1px,0); } }
  #hBob.hurt::after{ content:" CRITICAL"; color:var(--blood); animation:blink .5s steps(1) infinite; }
  /* the OPEN LOW warning after a feint nobody bought */
  .zone.open{ border:2px solid var(--blood); color:var(--blood); animation:blink .3s steps(1) infinite; }
  /* PAINTED SPRITES (0928) — the man, Bob's hand, effects, and the Leone eye close-up */
  /* one shared scale for every frame (a man lying down is short and wide), feet on a common baseline */
  #man.sprite{ top:55%; height:33vh; max-height:330px; display:flex; align-items:flex-end; justify-content:center; }
  #manImg{ display:none; margin:0 auto; image-rendering:auto;
    filter:drop-shadow(0 0 14px rgba(0,0,0,.85)); }
  #man.sprite #manImg{ display:block; } #man.sprite pre{ display:none; }
  .eyeDot{ position:absolute; z-index:2; border-radius:50%; background:#efe3c6; box-shadow:0 0 0 1px #2a1d10 inset;
    pointer-events:none; overflow:hidden; }
  .eyeDot i{ position:absolute; width:46%; height:78%; left:27%; top:11%; border-radius:50%; background:#1a120a; transition:top .08s, left .08s; }
  .eyeDot.HEAD i{ top:-12%; } .eyeDot.WING i{ top:36%; } .eyeDot.BOB i{ width:62%; height:92%; left:19%; top:4%; }
  .eyeDot.DEAD{ background:#c9b99a; } .eyeDot.DEAD i{ display:none; }
  #handImg{ position:absolute; left:67%; bottom:-2%; transform:translateX(-50%); height:26vh; max-height:260px; z-index:5;
    display:none; pointer-events:none; filter:drop-shadow(0 -4px 12px rgba(0,0,0,.8)); }
  #scene.painted #handImg{ display:block; } #scene.painted #hand{ display:none; }
  .fxImg{ position:absolute; z-index:6; pointer-events:none; transform:translate(-50%,-50%); animation:fxpop .45s ease-out forwards; }
  @keyframes fxpop{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.6); } 25%{ opacity:1; transform:translate(-50%,-50%) scale(1.05); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.15); } }
  /* the Leone insert: an extreme close-up of HIS eyes while you read him (the painted pupils are too small at play size) */
  #eyeInsert{ position:absolute; left:3%; top:20%; width:27%; z-index:6; display:none;
    border-top:3px solid #000; border-bottom:3px solid #000; background:#0b0806; box-shadow:0 0 30px rgba(0,0,0,.9); }
  #eyeInsert.on{ display:block; animation: rise .18s ease both; } #eyeInsert img{ display:block; width:100%; }
  /* painted cutscene stills (sprites/attract/) — a film frame inside the overlay; ASCII is the fallback */
  #overlay img.still{ max-width:94%; max-height:58vh; object-fit:contain; border:1px solid rgba(216,162,58,.25);
    box-shadow:0 0 40px rgba(0,0,0,.8); animation: rise .9s ease both; }
  #overlay pre.scene{ font-family:ui-monospace,Menlo,monospace; color:#cdd; font-size:clamp(9px,1.9vh,17px); line-height:1.15; white-space:pre; text-align:left; margin:.2em auto; }
  /* 2P — the gunman's player looks AT Bob (right panel); both players' picks are hidden keypresses */
  #p2view{ position:absolute; right:1.5%; top:12%; width:27%; z-index:3; display:none; text-align:center;
    border:1px solid rgba(122,76,255,.45); background:rgba(8,6,16,.72); border-radius:6px; padding:.4em .3em; }
  #p2view.on{ display:block; }
  #p2view .who{ color:#b9a6ff; font-size:clamp(10px,1.7vh,14px); letter-spacing:1px; }

// FIT THE TARGETS TO THE BODY. Measure the drawn figure (monospace grid) and place the zones on it:

const _fitCanvas = document.createElement("canvas");
function fitZonesImg(){
  const img = $("manImg"); if (!img.naturalWidth) return;
  const W = img.naturalWidth, H = img.naturalHeight; _fitCanvas.width = W; _fitCanvas.height = H;
  const cx = _fitCanvas.getContext("2d", { willReadFrequently:true }); cx.clearRect(0,0,W,H); cx.drawImage(img, 0, 0);

function fitZones(){

// nextKey now resolves on a TAP too (pointerdown), so a no-keyboard light-gun can advance
// any "press any key" beat. Predicates that demand a specific code still ignore the tap.
function nextKey(valid){
  return new Promise(res => {
    const cleanup = () => { window.removeEventListener("keydown", k); window.removeEventListener("pointerdown", p); };
    const k = e => { if (valid(e.code)) { cleanup(); res(e.code); } };
    const p = () => { if (valid("Pointer")) { cleanup(); res("Pointer"); } };

// ===== LIGHT-PISTOL AIM — the fused squeeze: WHERE the crosshair sits = the lane,
// WHEN you pull = the draw timing, HOW centered = the dead-eye. One motion, the whole duel. =====
const DEAD_EYE_TH = 0.55;                 // centering >= this on a HEAD kill = a clean DEAD-EYE headshot
let aimZone = CENTER, aimCenter = 1, aiming = false;
const scn = () => $("scene");
function hoverZone(lane){ LANES.forEach(l => $("z"+l).classList.toggle("aim", aiming && l===lane)); }
// which lane is under client-Y, and how centered (1 = bullseye, 0 = the edge / off the band)
function zoneAtY(cy){
  let best = { lane:CENTER, center:0 }, bd = 1e9;
  for (const l of LANES){ const r = $("z"+l).getBoundingClientRect(), mid = r.top + r.height/2, half = r.height/2 || 1;
    if (cy>=r.top && cy<=r.bottom) return { lane:l, center: 1 - Math.min(1, Math.abs(cy-mid)/half) };
    const d = Math.abs(cy-mid); if (d<bd){ bd=d; best={ lane:l, center:0 }; } }
  return best;
}
// a SHOT has to land ON him: inside a zone's box (x AND y), else it's WIDE (lane null). Centering is 2-D.
function zoneAtXY(cx, cy){
  for (const l of LANES){ const r = $("z"+l).getBoundingClientRect();
    if (cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom){
      const dx = Math.abs(cx-(r.left+r.width/2))/(r.width/2||1), dy = Math.abs(cy-(r.top+r.height/2))/(r.height/2||1);
      return { lane:l, center: 1 - Math.min(1, Math.max(dx, dy)) }; } }

}
// SWAY — "fast is fine, but accuracy is everything." In a SHOT the drawn crosshair = your hand + a sway that
// SETTLES after the draw starts (τ≈0.25s). Fire early and the sway decides where it lands. A winged Bob
// never fully settles. Render-only (the house glide pattern): the engine only ever sees the lane you hit.
const SWAY = { on:false, t0:0, shaky:false };
let ptrX = 0, ptrY = 0, drawnX = 0, drawnY = 0;
function swayOffset(){
  if (!SWAY.on) return [0,0];
  const t = (performance.now() - SWAY.t0)/1000, H = scn().getBoundingClientRect().height;
  const tau = SWAY.shaky ? TIMING.swayTau*1.8 : TIMING.swayTau;              // CRITICAL: settles slower…
  const amp = H*TIMING.swayAmp*(SWAY.shaky ? 1.35 : 1)*Math.exp(-t/tau)
            + H*(SWAY.shaky ? TIMING.swayShaky*(1 + 0.5*Math.sin(t*6.3)) : TIMING.swaySettled);   // …and never sits still (a pulse)
  return [amp*Math.sin(t*9.1+0.6), amp*Math.sin(t*7.3+1.9)];
}
function placeAim(){
  const [ox, oy] = swayOffset(); drawnX = ptrX + ox; drawnY = ptrY + oy;
  const s = scn().getBoundingClientRect(), a = $("aim");
  a.style.left = (drawnX-s.left)+"px"; a.style.top = (drawnY-s.top)+"px"; if (aiming) a.classList.add("on");
  const z = SWAY.on ? zoneAtXY(drawnX, drawnY) : zoneAtY(drawnY);
  aimZone = z.lane; aimCenter = z.center; hoverZone(z.lane);
}
function moveAim(cx, cy){ ptrX = cx; ptrY = cy; placeAim(); }
(function swayLoop(){ if (SWAY.on) placeAim(); requestAnimationFrame(swayLoop); })();
const laneCenter = l => { const r = $("z"+l).getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };

// resolve to {lane, center} on a squeeze: tap/click a zone, Space (current hover), or a ↑●↓ key.
// opts.timeout (ms) -> resolves {lane:null} if you don't squeeze in time (the READ WINDOW).
// opts.pres -> the President is a target: clicking him (or P) resolves lane "PRES".
// opts.shoot -> a SHOT: the crosshair sways and settles; ↑●↓ MOVE your hand to a lane (they don't fire);
// the click / Space / FIRE button fires wherever the DRAWN crosshair is. Off every zone = WIDE (lane null).
function aimFire(opts={}){
  return new Promise(res => {
    aiming = true; $("aim").classList.add("hot");
    if (opts.shoot){ SWAY.on = true; SWAY.t0 = performance.now(); placeAim(); }
    let timer = null;
    const finish = (lane, center) => {
      SWAY.on = false;
      scn().removeEventListener("pointerdown", pd); window.removeEventListener("keydown", kd); if (timer) clearTimeout(timer);
      aiming = false; $("aim").classList.remove("hot","on"); LANES.forEach(l => $("z"+l).classList.remove("aim")); $("pres").classList.remove("aim");
      res({ lane, center });
    };
    const pd = e => { if (e.target.closest("#overlay")) return; e.preventDefault();
      if (opts.pres && e.target.closest("#pres")) return finish("PRES", 1);
      ptrX = e.clientX; ptrY = e.clientY; placeAim(); finish(aimZone, aimCenter); };
    const kd = e => { if (opts.pres && e.code==="KeyP") finish("PRES", 1);
      else if (e.code in KEYLANE){ if (opts.shoot){ const [x,y] = laneCenter(KEYLANE[e.code]); ptrX = x; ptrY = y; placeAim(); } else finish(KEYLANE[e.code], 1); }
      else if (e.code==="Space") finish(aimZone, aimCenter); };

// THE DRAW. "steady…" is a trap: fire now and it's a FALSE START (CRACK — he stares — he draws).
// His body may TWITCH (a feint) to bait exactly that. Then DRAW! — crosshair already on his chest.
// Returns { t (s, Infinity on a false start), lane, center }.
async function drawShoot(feint, opts={}){
  prompt(`<small>steady…</small> &nbsp; <span class="k">F</span> <small>sell the shoulder</small>`); clock("");
  iris("tight"); hand("idle"); POSE.breathing = true;
  const wait = TIMING.steadyMin + Math.random()*TIMING.steadyRand;
  let early = false, feinted = null;
  const bait = e => {
    if (e.type==="keydown" && e.code==="KeyF"){ if (!feinted && opts.onFeint) feinted = "asked"; return; }
    if (e.type==="pointerdown" && e.button===1){ e.preventDefault(); if (!feinted && opts.onFeint) feinted = "asked"; return; }
    if (e.type==="keydown" && !(e.code in KEYLANE) && e.code!=="Space") return;
    if (e.target && e.target.closest && e.target.closest("#overlay")) return;
    if (opts.nerve && opts.nerve()){ banner("COLD NERVE", "your hand stays. (once a stage)", true); return; }
    early = true; };

  const t0w = performance.now(); let twitched = !feint, twitchAt = wait*(0.35 + Math.random()*0.35), bit = false;
  while (!early && !bit && performance.now()-t0w < wait){
    if (!twitched && performance.now()-t0w >= twitchAt){ twitched = true;           // HIS feint: the body lies
      const m=$("man"); m.classList.remove("twitch"); void m.offsetWidth; m.classList.add("twitch"); sfx.twitch();
      const was = POSE.state; pose("twitch"); setTimeout(() => { if (POSE.state==="twitch") pose(was==="twitch"?"idleA":was); }, TIMING.twitch); }
    if (feinted === "asked"){ feinted = await opts.onFeint(); if (feinted === "bit") bit = true; }   // YOUR feint
    await sleep(16);
  }
  window.removeEventListener("keydown", bait); scn().removeEventListener("pointerdown", bait);
  POSE.breathing = false;
  if (early) return { t: Infinity, lane: null, center: 0, falseStart: true, feint: feinted };
  centerAim(); iris("open"); hand("aim");
  if (POSE.char && !POSE.pair && !bit) pose("draw");                                  // his hand snaps to the gun
  const t0 = performance.now();
  prompt(`<span class="big gold">DRAW!</span> &nbsp; <small>correct &amp; fire — go for the head</small>`);
  const fired = await new Promise(res => aimFire({ timeout: TIMING.drawTimeout, pres: !!opts.pres, shoot: true }).then(r => res({ ...r, at: performance.now() })));
  const timedOut = fired.lane === null && fired.at - t0 >= TIMING.drawTimeout - 10;

}

// ---- the interactive duel (mirrors engine.exchange rules, async for the human) ----
// opts.alt = THE PRESIDENT in frame (a target you may choose). opts.first = force who draws (the flash).
// opts.readMs = your READ WINDOW once he's drawn on you.
async function exchange(eng, bob, opp, run, opts={}){
  const readMs = opts.readMs || TIMING.readWindow;
  SWAY.shaky = bob.winged; bob.exposed = false; opp.exposed = false;
  drawMan(opp.char, opp.winged); setLife(bob, opp); hand(bob.winged ? "hurt" : "idle");
  let attacker, shot = null;
  if (opts.first){ attacker = opts.first; }
  else {
    showGuard(opp, bob);                                          // his guard, drifting to your habit
    let tb = opp.ctrl.reflex(opp.char, eng.rng); if (opp.winged) tb += WINGED_SLOW;
    const feint = !!(opp.char.feint && eng.rng.random() < opp.char.feint);
    // YOUR shoulder feint (F / middle-click / cab button 2): if he bites he fires into the dirt and the draw
    // is yours; if he doesn't, you're slower AND open low — a wing will kill you this exchange.
    const onFeint = async () => {
      hand("feint"); sfx.twitch();
      if (opp.ctrl.bites(opp.char, eng.rng) || (bob.perks.has("SELL_IT") && eng.rng.random() < SELL_IT_SECOND)){  // SELL IT: a second chance

        await sleep(TIMING.falseStartCrack); return "bit"; }
      bob.exposed = true; $("zWING").classList.add("open");

    };

    shot = await drawShoot(feint, { pres: !!opts.alt, onFeint, nerve });
    let ta = shot.t; if (ta !== Infinity && bob.winged && !bob.perks.has("COLD_NERVE")) ta += WINGED_SLOW;
    if (ta !== Infinity && bob.perks.has("QUICK_HAND")) ta -= QUICK_HAND_S;
    if (shot.feint === "miss" && ta !== Infinity && !bob.perks.has("SELL_IT")) ta += FEINT_COST;
    if (shot.bit) tb = Infinity;
    if (shot.falseStart) await falseStart(opp.char, opp.winged);
    const youFirst = ta <= tb;
    attacker = youFirst ? bob : opp;
    clock(`BOB <b>${fmt(ta)}</b> &nbsp;—&nbsp; ${opp.char.name} <b>${fmt(tb)}</b>${youFirst?"":' &nbsp;<span class="late">he\'s first</span>'}`);

  }
  const reader = attacker === bob ? opp : bob;
  banner(attacker===bob ? "YOU'RE FIRST" : `${opp.char.name} IS FIRST`, attacker===bob ? "take the shot" : "watch his eyes", true);

  if (attacker === bob){
    // WHOA — only Bob, only when available, only in a ~600ms window; nothing = the clean shot you earned
    const whoa = bob.whoa_available && bob.char.showboat && await whoaWindow();
    if (!whoa){
      if (opts.alt && shot.lane === "PRES"){                       // he turned the gun on the President
        opts.alt.alive = false; showPres(true, true); await muzzleFX(); sfx.shot(); sfx.roar(); flare(); sting('pres');
        banner("THE PRESIDENT OF MICHIGAN", "dead. on the broadcast.", true); await sleep(1200);
        return { dead: opts.alt, out: KILL };
      }
      const lane = shot.lane, clean = shot.center >= DEAD_EYE_TH;
      if (!lane){ await freeze(null, null, true); sfx.shot(); sfx.block(); fxAt("dust", 0.5, 0.95);   // pulled it WIDE — the sway won
        banner("WIDE", "you pulled it. he's still out there.", true); if (run) run.deadeye = 0; await sleep(500);
        return { dead:null, out:GRAZE }; }
      const read = opp.ctrl.defend_read(opp.char, bob.attacks, eng.rng, lane);
      bob.attacks.push(lane); opp.reads.push(read);
      const out = eng._resolve(bob, lane, read, opp);
      await freeze(lane, read, true);
      if (out !== GRAZE) await muzzleFX();
      if (run){ if (out===KILL && lane===HEAD) deadEye(run, clean); else run.deadeye = 0; }
      return land(opp, out, bob, lane, read);
    }
    // WHOA path — FAN THE HAMMER (the all-in, two-axis: stance from the fan + lane from the kill)
    if (bob.whoa_spare > 0) bob.whoa_spare--; else bob.whoa_available = false;   // TWO WHOAS
    const fan = await fanTheHammer();
    const [rSt, rLane] = opp.ctrl.whoa_read(opp.char, eng.rng);
    const out = resolveWhoa(fan.stance, fan.lane, rSt, rLane);
    banner("WHOA!", out===KILL ? "DID YOU SEE THAT?!" : out===MISFIRE ? "the hammer jams — he read it all" : "half — he staggers into your second shot", true); await sleep(600);
    if (out===KILL){ opp.alive=false; sfx.shot(); dropFoe();
      if (run){ if (fan.lane===HEAD && fan.clean) deadEye(run, true); else run.deadeye = 0; }
      return {dead:opp, out:KILL}; }
    if (run) run.deadeye = 0;
    if (out===MISFIRE){ sfx.block(); return {dead:null, out:MISFIRE}; }
    const lane2 = (await askLane("SECOND SHOT —", { timeout: 1200, shoot: true })) || CENTER;   // Bob's DEAD-EYE rebound is guaranteed
    const read2 = opp.ctrl.defend_read(opp.char, bob.attacks, eng.rng, lane2);
    bob.attacks.push(lane2); opp.reads.push(read2);
    const o2 = eng._resolve(bob, lane2, read2, opp);
    await freeze(lane2, read2, true);
    return land(opp, o2, bob, lane2, read2, true);
  }
  // HE drew first: his EYES go somewhere (honest only sometimes); you have a READ WINDOW to guard.
  const lane = opp.ctrl.attack_lane(opp.char, bob.reads, eng.rng);
  const tell = eng._tell(opp, lane, bob);
  drawMan(opp.char, opp.winged, tell === null ? "BLIND" : tell, opp.winged ? "winged_draw" : "draw"); POSE.breathing = false;
  const cue = shoulderCue(lane, tell, readMs);
  eyeInsert(tell === null ? null : tell);                          // the Leone close-up: read HIS eyes
  const read = await askLane(tell === null ? `<span class="lethal">READ HIM</span> — you can't see his eyes`
                                          : `READ ${PR(opp.char).HIM} — ${PR(opp.char).his} eyes: <b>${EYE_WORD[tell]}</b>`, { timeout: readMs });
  cue(); eyeInsert(null);
  bob.reads.push(read); opp.attacks.push(lane);
  pose("fire"); sfx.shot(); await sleep(TIMING.firePose);                 // his muzzle flash
  const out = eng._resolve(opp, lane, read, bob);
  $("zWING").classList.remove("open");
  await freeze(lane, read, false);
  drawMan(opp.char, opp.winged);
  return land(bob, out, opp, lane, read);
}
async function land(reader, out, attacker, lane, read, second=false){
  const verb = label(attacker.char.weapon, lane);
  const you = reader.ctrl && reader.ctrl.is_human;          // is the PLAYER the one being struck?
  const bob = you ? reader : attacker, foe = you ? attacker : reader;
  $("zWING").classList.remove("open");
  if (out===WINGED && reader.flesh > 0){                   // FLESH WOUND: just a scratch
    reader.flesh--; sfx.block(); banner(you ? "JUST A SCRATCH" : "A SCRATCH", "FLESH WOUND — once a stage", true);
    setLife(bob, POSE.pair || foe); return {dead:null, out:GRAZE};
  }
  if (out===KILL || (out===WINGED && reader.winged)){
    const finished = out===WINGED;
    reader.alive=false; sfx.shot();
    if(!you && !POSE.pair){ pose(lane===HEAD ? "hit_head" : "hit_center", "DEAD"); fxAt("blood", 0.5, lane===HEAD ? 0.12 : 0.35); await sleep(TIMING.hitPose); dropFoe(); }
    else if (!you) { flare(); sfx.roar(); }
    banner(you ? (finished ? "FINISHED — you're gone" : "YOU'RE DEAD") : (finished ? "FINISHED" : "KILL"), finished ? "winged again" : verb, true);
    setLife(bob, POSE.pair || foe); return {dead:reader, out:KILL};
  }
  if (out===WINGED){
    sfx.shot();
    reader.winged=true; sfx.wound();
    if(!you){ if (!POSE.pair){ drawMan(reader.char, true); woundFX(); fxAt("blood", 0.62, 0.62, 0.7); } } else { $("hand").classList.add("hurt"); hand("hurt"); }
    banner(you?"CRITICAL":"WINGED", you?"you're hit. one more and you're done — your hand won't settle":`${PR(reader.char).he}'ll be back — crippled`);
    setLife(bob, POSE.pair || foe); return {dead:null, out};
  }
  { const q = PR(foe.char); sfx.block(); banner(you?"YOU READ IT":"BLOCKED", you?`${q.his} shot — blocked. ${q.he}'s still out there.`:`${q.he} read it — ${q.he}'s still out there.`); }
  setLife(bob, POSE.pair || foe); return {dead:null, out:GRAZE};
}

// THE SEVEN-JOHNS — two men at once (mirrors engine.exchange_pair). One draw, three hands; the fastest
// acts first. Your turn = one pull per John still standing. A John's turn = his eyes, your read window.
async function pairExchange(eng, bob, j1, j2, run){
  drawPair(j1, j2); setLife(bob, [j1, j2]); bob.exposed = false;
  let t1 = j1.ctrl.reflex(j1.char, eng.rng), t2 = j2.ctrl.reflex(j2.char, eng.rng);
  const shot = await drawShoot(false);
  drawPair(j1, j2, null, null, "draw", "draw");
  let tb = shot.t; if (tb !== Infinity && bob.winged && !bob.perks.has("COLD_NERVE")) tb += WINGED_SLOW;
  if (tb !== Infinity && bob.perks.has("QUICK_HAND")) tb -= QUICK_HAND_S;
  if (shot.falseStart){ sfx.shot(); banner("CRACK —", "you fired early. both of them look at you.", true); await sleep(900); }
  clock(`BOB <b>${fmt(tb)}</b> &nbsp;—&nbsp; JOHN <b>${fmt(t1)}</b> &nbsp;—&nbsp; JOHN <b>${fmt(t2)}</b>`);
  const order = [[tb,0,bob],[t1,1,j1],[t2,2,j2]].sort((x,y)=> x[0]<y[0]?-1 : x[0]>y[0]?1 : x[1]-y[1]);
  let firstPull = shot.lane;
  for (const [, , who] of order){
    if (who === bob){
      for (const [j, side] of [[j1,"LEFT"],[j2,"RIGHT"]]){
        if (!j.alive) continue;
        let lane = firstPull; firstPull = null;
        if (!lane) lane = await askLane(`PULL — the <b>${side}</b> JOHN`, { timeout: 900, shoot: true });
        if (!lane){ banner("WIDE", `the ${side.toLowerCase()} John is still standing`, true); await sleep(400); continue; }
        const read = j.ctrl.defend_read(j.char, bob.attacks, eng.rng, lane);
        bob.attacks.push(lane); j.reads.push(read);
        const out = eng._resolve(bob, lane, read, j);
        await freeze(lane, read, true); await muzzleFX();
        if (out===KILL || (out===WINGED && j.winged)){ j.alive=false; sfx.shot(); flare(); sfx.roar(); }
        else if (out===WINGED){ j.winged=true; sfx.wound(); } else sfx.block();
        drawPair(j1, j2); setLife(bob, [j1, j2]);
      }
    } else if (who.alive){
      const lane = who.ctrl.attack_lane(who.char, bob.reads, eng.rng);
      const tell = eng._tell(who, lane, bob);
      drawPair(j1, j2, who===j1 ? tell : null, who===j2 ? tell : null, who===j1 ? "draw" : null, who===j2 ? "draw" : null);
      const cue = shoulderCue(lane, tell, 1400);
      const read = await askLane(`READ the <b>${who===j1?"LEFT":"RIGHT"}</b> JOHN — his eyes: <b>${EYE_WORD[tell]}</b>`, { timeout: 1400 });
      cue();
      bob.reads.push(read); who.attacks.push(lane);
      drawPair(j1, j2, null, null, who===j1 ? "fire" : null, who===j2 ? "fire" : null); sfx.shot(); await sleep(TIMING.firePose);
      const out = eng._resolve(who, lane, read, bob);
      await freeze(lane, read, false); drawPair(j1, j2);
      const r = await land(bob, out, who, lane, read);
      if (r.dead === bob) return { dead: bob };
    }
  }
  return { dead: null };
}

// PERKS — after stages 1-3: pick ONE of TWO (pairs measured EVEN — docs/PERKS.md). Mirrors engine.stage_end.
async function perkPick(bob, si){
  if (bob.perks.has("SECOND_WIND") && bob.winged){ bob.winged = false; $("hand").classList.remove("hurt"); setLife(bob);
    await story("SECOND WIND", "he walks it off."); }
  if (si >= PERK_PAIRS.length) return;

    <p><span class="k">2</span> <b class="gold">${PERKS[b][0]}</b> — ${PERKS[b][1]}</p>`);

}

// ---- run ----
const STAGE_MOTIVE = STAGES;
async function play(){
  const eng = new Engine(Math.floor(Math.random()*1e9));
  const bob = new Side(BOB, new HumanCtl());
  const run = { legend:0, score:0, cleared:0, surveillance:0, anders_scrubs:2, deadeye:0, deadeyeBest:0, president_dead:false };
  const pool = [];                                   // the men still out there
  $("hand").classList.remove("hurt"); hand("idle"); showPres(false); setHUD(run); setPoem(0); setLife(bob, null); iris(null); critical(false);
  await playScene("cold_open");

  for (let si=0; si<STAGE_MOTIVE.length; si++){
    stageStart(bob); bob.nerve = 1;                  // the all-in once a stage (+ perks)
    hideOverlay(); clock("");
    sting('duel'); iris(null);
    await playScene("stage" + (si+1));
    banner(`STAGE ${si+1}: ${STAGE_MOTIVE[si][0]}`, "he fights " + STAGE_MOTIVE[si][1], true);

    for (let bi=0; bi<DECISIONS_PER_STAGE; bi++){
      run.surveillance += 1; setHUD(run);
      bob.lethal_wing = run.legend >= LEGEND_LOUD;
      let back = null;
      const opp = beatOpponent(si, bi, pool, (k, a) => { if (k === "returns") back = a.side; });
      if (back){                                       // I THOUGHT YOU WERE DEAD — a man you left standing walks back in
        drawMan(back.char, back.winged);
        await playScene("returns", { name: back.char.name, winged: back.winged ? ", arm hanging uselessly." : "." });
      }
      let res;
      if (Array.isArray(opp)){
        await playScene("johns"); banner("THE SEVEN-JOHNS", "one pull each", true);
        res = await pairExchange(eng, bob, opp[0], opp[1], run);
      } else {
        const boss = isBossChar(opp.char);
        banner(opp.char.name, boss ? (BOSS_TELL[opp.char.name] || "BOSS") : opp.char.title, true);
        res = await exchange(eng, bob, opp, run);
        if (res.dead !== bob && opp.alive){ pool.push(opp); }
      }
      clearZones();
      if (res.dead === bob){ return end(run, `DIED — ${STAGE_MOTIVE[si][0]}, beat ${bi+1}`, eng); }
      run.cleared += 1; run.score += beatScore(si, opp); setPoem(run.cleared); setHUD(run);
      await sleep(TIMING.bannerBeat); iris(null);
      await playScene("camera");                        // the lens turns toward Bob
      if (await askYesNo(`<span class="gold">DID YOU SEE THAT?</span> put it on the record?`)){
        run.legend += 1; run.surveillance += 1; run.score += SCORE_ON_RECORD; setHUD(run);
      }
    }
    if (si===0){ await playScene("wound"); }
    if (si===1 && await thePresident(eng, bob, run)) return end(run, "DIED — THE PRESIDENT'S MAN", eng);
    if (si===2 && run.president_dead && await heyBobSmile(eng, bob, run)) return end(run, "DIED — HEY BOB, SMILE!", eng);
    if (si < STAGE_MOTIVE.length-1){
      if (run.anders_scrubs>0 && run.surveillance>0){ run.anders_scrubs--; run.surveillance=Math.max(0,run.surveillance-3); setHUD(run);
        await playScene("anders"); }
      run.score += BONUS_BASE[si]; setHUD(run);
      coinRain(); sfx.coins(); flare();
      await story("✶ BONUS ✶", `the crowd throws coins — <span class="gold">+${BONUS_BASE[si]}</span>`);
    }
    await perkPick(bob, si);                         // SECOND WIND heals; then 1 of 2 perks
  }
  run.score += SCORE_REACH_TABLE; setHUD(run);
  return couplet(eng, bob, run);
}

// THE PRESIDENT — two fights. His security draws on Bob; the President stands beside him for the cameras.
// Win the draw and the shot is yours: his man — or HIM (click him / P). Shoot him and he DIES on the broadcast.
async function thePresident(eng, bob, run){
  hideOverlay(); clock(""); iris(null);
  sting('pres'); await playScene("president");
  const president = new Side(PRESIDENT, new AIController());
  const whoa = bob.whoa_available; bob.whoa_available = false;
  bob.lethal_wing = run.legend >= LEGEND_LOUD;
  showPres(true);
  for (let i=0;i<2;i++){
    const guard = new Side(PRESIDENTS_MAN, new AIController());
    banner(guard.char.name, president.alive ? "the President stands right there. you could." : "the President is dead. his man isn't.", true);
    const res = await exchange(eng, bob, guard, run, { alt: president.alive ? president : null });
    clearZones();
    if (res.dead === bob){ showPres(false); bob.whoa_available = whoa; return true; }
    if (res.dead === president){ run.president_dead = true; run.legend += 3; run.score += SCORE_PRESIDENT; setHUD(run);
      await playScene("president_dead"); }
    else if (!guard.alive) { run.score += Math.floor(SCORE_DUEL[1]/2); setHUD(run); }
  }
  showPres(false); bob.whoa_available = whoa;
  if (!run.president_dead){ run.surveillance=Math.max(0,run.surveillance-2); setHUD(run);
    await playScene("president_held"); }
  return false;
}

// THE BUTTON FLIPS — all game YOU pressed "DID YOU SEE THAT?" to bank legend; now the crowd
// presses it AT Bob, his own legend (run.legend) become the count against the man. Show-don't-tell
// of the whole game's thesis. Presentation only — reads run.legend, changes nothing.
async function crowdFlip(run){
  const presses = Math.max(3, Math.min(13, run.legend || 0));   // his legend, turned on him (min 3 even if he kept quiet)
  const BTN = lit => `      ╔═══════════════════════╗
      ║   DID YOU SEE THAT?    ║
      ║   ${lit ? "█████  PRESSED  █████" : "·  on the record  ·  "}   ║
      ╚═══════════════════════╝`;
  const lead = (run.legend||0) > 0
    ? `all game, <span class="gold">you</span> pressed it — every kill on the record.`
    : `you kept it quiet. it didn't matter — <span class="gold">the city saw every one.</span>`;
  const o = overlay(`<h1 class="lethal">THE BUTTON FLIPS</h1>
    <p>${lead}</p><p class="dim">now the crowd presses it. <b>at you.</b></p>
    <pre id="flipbtn">${BTN(false)}</pre><div id="flipcount" class="dim"></div>`);
  o.className = "show"; await sleep(950);
  for (let i=1;i<=presses;i++){
    const b = $("flipbtn"); b.textContent = BTN(true); b.classList.remove("mash"); void b.offsetWidth; b.classList.add("mash");
    $("flipcount").innerHTML = `<span class="lethal">DID YOU SEE THAT?!</span> &nbsp; ×${i}`;
    sfx.shot(); flare();
    await sleep(Math.max(95, 300 - i*16));                       // accelerando — the chant speeds up
    b.textContent = BTN(false); b.classList.remove("mash");
    await sleep(Math.max(45, 110 - i*5));
  }
  $("flipcount").innerHTML = `<span class="lethal">the legend you built — <b>${presses}</b> counts against the man.</span>`;
  await sleep(1100); hideOverlay();
}
// MY LAST RITES — RUSSIAN ROULETTE (mirrors engine.roulette). Your record LOADS the cylinder, side by
// side, where you can see it: a quiet man 1 bullet, a legend 3. They spin it; you pull. If it clicks:
// SPIN again, or fire the NEXT chamber. 1 bullet → spin (1/6 vs 1/5). 3 bullets → don't (1/3 vs 3/6).
// the spin — the loaded pattern rotates past the hammer (visual only; the engine picks the chamber)
async function spinCylinder(bullets){
  for (let i=0;i<TIMING.cylinderSpins;i++){
    const off = i % CHAMBERS; let h = "";
    for (let c=0;c<CHAMBERS;c++){ const live = ((c + off) % CHAMBERS) < bullets; h += `<span class="${live?"live":"empty"}">${live?"●":"○"}</span>`; }
    overlay(`<h1>they spin it</h1><div class="cyl">( ${h} )</div><p class="dim">▲ the hammer</p>`);
    sfx.hammer(); await sleep(TIMING.cylinderTick + i*6);
  }
}
function cylinder(bullets, firedPos=null){
  let h = "";
  for (let c=0;c<CHAMBERS;c++){
    const live = c < bullets, cls = c===firedPos ? "fired" : live ? "live" : "empty";
    h += `<span class="${cls}">${live ? "●" : "○"}</span>`;
  }
  return `<div class="cyl">( ${h} )</div>`;
}
async function couplet(eng, bob, run){
  hideOverlay(); clock("");
  banner("MY LAST RITES", "the chamber — the one duel DEAD-EYE can't win", true);
  await crowdFlip(run);
  const bullets = bulletsFor(run.legend);
  const lead = bullets === 1 ? "a quiet man. <b>one</b> in the chamber." : `a legend. <span class="lethal"><b>three</b>, side by side.</span>`;
  overlay(`<h1>THE CHAMBER</h1><p>${lead}</p>${cylinder(bullets)}<p class="dim">they load it where you can see it. they spin it. they hand it to you.</p><div class="start">pull — press any key</div>`);
  await nextKey(()=>true);
  await spinCylinder(bullets);
  const chambers = [0,1,2,3,4,5];
  let pos = eng.rng.choice(chambers);
  let alive = pos >= bullets;
  sfx.hammer();
  if (alive){
    overlay(`<h1>— click.</h1>${cylinder(bullets)}<p>empty. one more.</p><p class="dim">spin it again — or fire the <b>next</b> chamber?</p>`);
    await sleep(500);
    const spin = await askButtons("", [
      { id:"bS", html:"SPIN", val:true,  keys:["KeyS"] },
      { id:"bX", html:"NEXT CHAMBER", val:false, keys:["KeyN","KeyX"] }]);
    if (spin) await spinCylinder(bullets);
    pos = spin ? eng.rng.choice(chambers) : (pos + 1) % CHAMBERS;
    overlay(`<h1>${spin ? "he spins it." : "the next chamber."}</h1>${cylinder(bullets)}<p class="dim">…</p>`);
    await sleep(1100); sfx.hammer();
    alive = pos >= bullets;
  }
  prompt("");
  if (alive){ sfx.block(); await playScene("the_man"); }
  else { sfx.shot(); flare(); await playScene("the_chamber"); }
  run.cleared += 2; setPoem(run.cleared);
  const ending = alive ? "THE MAN" : "THE CHAMBER";
  run.score += ending==="THE MAN" ? SCORE_THE_MAN : SCORE_THE_CHAMBER; setHUD(run);
  return end(run, ending, eng);
}

// human controller stub so opp code paths that call bob.ctrl never run during human turns
class HumanCtl{ get is_human(){return true;} reflex(){return 0;} bites(){return false;} pick_target(){return false;} spin_again(){return false;} }

// CUTSCENES (rig.mjs SCENES) — timed ASCII beats; any key skips a beat after TIMING.sceneMinBeforeSkip.
// Each beat maps 1:1 to a painted still later. {name}/{winged} fill from vars.
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function holdOrSkip(ms){
  return new Promise(res => {
    const t0 = performance.now();
    const done = () => { clearTimeout(t); window.removeEventListener("keydown", k); window.removeEventListener("pointerdown", k); res(); };
    const k = () => { if (performance.now() - t0 >= TIMING.sceneMinBeforeSkip) done(); };
    const t = setTimeout(done, ms);
    window.addEventListener("keydown", k); window.addEventListener("pointerdown", k);
  });
}
async function playScene(name, vars={}){
  const beats = RIG_SCENES[name]; if (!beats) return;
  const fill = t => esc(t || "").replace(/\{(\w+)\}/g, (_, v) => esc(vars[v] ?? ""));
  for (const b of beats){
    const still = b.img ? `<img class="still" src="${b.img}" alt="" onerror="const p=this.nextElementSibling; if(p) p.hidden=false; this.remove()">` : "";
    const o = overlay(`${still}${b.art ? `<pre class="scene"${b.img ? " hidden" : ""}>${esc(b.art)}</pre>` : ""}${b.h ? `<h1 class="${b.cls||""}">${fill(b.h)}</h1>` : ""}${b.text ? `<p>${fill(b.text)}</p>` : ""}`);
    o.className = "show attract";
    await holdOrSkip(b.ms);
  }
  hideOverlay();
}
Object.values(RIG_SCENES).flat().forEach(b => { if (b.img){ const i = new Image(); i.src = b.img; } });   // preload the stills
window.__rig = { playScene, frame, SCENES: RIG_SCENES, TIMING, critical: on => critical(on) };

async function end(run, ending, eng){

    : man ? `<p>she pulls him from the chamber.<br>back to <span class="gold">frame one</span> — the kitchen.</p>`
          : `<p>the crowd got its count.<br><span class="lethal">the man is gone.</span></p>`;

  await nextKey(()=>true);
  boot();
}

let attractOn = false;
function attract() {
  attractOn = true;
  try { AUDIO.currentTime = 0; } catch {}
  AUDIO.play().catch(() => {});                    // unlocked by the boot keypress gesture
  const t0 = performance.now();
  let last = null;
  const tick = () => {
    if (!attractOn) return;
    const t = AUDIO.paused ? ((performance.now() - t0) / 1000) % TRACK : AUDIO.currentTime;  // music clock, wall-clock fallback
    const key = sceneKey(t);
    if (key !== last) { last = key; renderScene(key); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  nextKey(() => true).then(() => { attractOn = false; try { AUDIO.pause(); AUDIO.currentTime = 0; } catch {} startGame(); });

// 2 PLAYERS — THE TOURNAMENT. P1 is Bob; P2 steps into each gunman/gunwoman of the lineup in turn.
// Mirrors engine.tournament(): a bout = up to BOUT_EXCHANGES exchanges (or BANGKOK: make-or-die volleys);
// every exchange P2's gunman SURVIVES earns P2 a perk for that gunman (1 of 2, max 2). Then SWAP SEATS and
// play again — whoever's Bob gets further wins. Picks are HIDDEN keypresses, so one screen is fair.
//   BOB's seat:     draw ⇧ Left-Shift · aim/guard W S X · feint Q
//   GUNMAN's seat:  draw ⇧ Right-Shift or Enter · aim/guard I K M · feint U
// (the Seven-Johns: the gunman's seat plays BOTH on one draw — one hand, two guns)
// ======================================================================================
const SEATS = [
  { name:"P1", draw:["ShiftLeft"], lanes:{ KeyW:HEAD, KeyS:CENTER, KeyX:WING }, feint:"KeyQ", keysTxt:"⇧L draw · W S X · Q feint" },
  { name:"P2", draw:["ShiftRight","Enter"], lanes:{ KeyI:HEAD, KeyK:CENTER, KeyM:WING }, feint:"KeyU", keysTxt:"⇧R/Enter draw · I K M · U feint" },
];
function p2show(on){ $("p2view").classList.toggle("on", on); }
function p2draw(gunName, gunPron, eyes, cue=""){
  $("p2who").textContent = `${gunName} — the gunman's seat${gunPron==="she" ? " (she)" : ""}`;
  $("p2art").textContent = bobFrame(eyes); $("p2cue").textContent = cue;
}
// one hidden lane pick from a seat within ms (null = no pick). Shows only "LOCKED".
function hiddenLane(seat, ms, label){
  return new Promise(res => {
    const done = v => { window.removeEventListener("keydown", kd); clearTimeout(t); res(v); };
    const kd = e => { if (e.code in seat.lanes){ e.preventDefault(); done(seat.lanes[e.code]); } };
    window.addEventListener("keydown", kd); const t = setTimeout(() => done(null), ms);
    if (label) prompt(label);
  });
}
// both seats pick at once (Bangkok): each seat's FIRST lane key = where it fires, SECOND = where it guards.
function hiddenVolley(ms){
  return new Promise(res => {
    const picks = [[], []];
    const kd = e => { SEATS.forEach((st, i) => { if (e.code in st.lanes && picks[i].length < 2){ e.preventDefault(); picks[i].push(st.lanes[e.code]);
      prompt(`BANGKOK — P1 <span class="locked">${"●".repeat(picks[0].length)}</span> · P2 <span class="locked">${"●".repeat(picks[1].length)}</span>`); } });
      if (picks[0].length === 2 && picks[1].length === 2) done(); };
    const done = () => { window.removeEventListener("keydown", kd); clearTimeout(t); res(picks); };
    window.addEventListener("keydown", kd); const t = setTimeout(done, ms);
  });
}
// THE DRAW RACE between two humans. Early draw during steady = FALSE START (unless COLD NERVE forgives it).
// A feint (Q/U) twitches the feinter's body; if the OTHER seat then jumps early, it bit — else the feinter
// pays: FEINT_COST slower and OPEN LOW. Returns times (s) for [bob, gun].
async function twoDraw(bob, gun, seatB, seatG){
  prompt(`<small>steady…</small> &nbsp; <small>${seatB.name} ${seatB.keysTxt} &nbsp;|&nbsp; ${seatG.name} ${seatG.keysTxt}</small>`);
  iris("tight"); POSE.breathing = true; clock("");
  const wait = TIMING.steadyMin + Math.random()*TIMING.steadyRand, t0w = performance.now();
  const sides = [bob, gun], seats = [seatB, seatG];
  const st = [{ early:false, t:null, feint:null, nerve: sides[0].perks.has("COLD_NERVE") ? 1 : 0 },
              { early:false, t:null, feint:null, nerve: sides[1].perks.has("COLD_NERVE") ? 1 : 0 }];
  let phase = "steady", tDraw = 0;
  const kd = e => {
    seats.forEach((seat, i) => {
      if (seat.draw.includes(e.code)){ e.preventDefault();
        if (phase === "steady"){ if (st[i].nerve){ st[i].nerve--; banner("COLD NERVE", `${seat.name}'s hand stays`, true); return; }
          st[i].early = true; const o = 1-i; if (st[o].feint === "pending") st[o].feint = "bit"; }
        else if (st[i].t === null) st[i].t = (performance.now() - tDraw)/1000; }
      if (e.code === seat.feint && phase === "steady" && !st[i].feint){
        st[i].feint = "pending"; sfx.twitch();
        if (i === 1){ const was = POSE.state; pose("twitch"); setTimeout(() => { if (POSE.state === "twitch") pose(was === "twitch" ? "idleA" : was); }, TIMING.twitch); }
        else { hand("feint"); setTimeout(() => hand("idle"), TIMING.twitch*2); }
      }
    });
  };
  window.addEventListener("keydown", kd);
  while (phase === "steady" && performance.now()-t0w < wait && !st[0].early && !st[1].early) await sleep(16);
  phase = "draw"; POSE.breathing = false; iris("open");
  if (!st[0].early && !st[1].early){
    tDraw = performance.now(); pose(gun.winged ? "winged_draw" : "draw"); hand("aim");
    prompt(`<span class="big gold">DRAW!</span>`);
    while ((st[0].t === null || st[1].t === null) && performance.now()-tDraw < TIMING.drawTimeout) await sleep(8);
  }
  window.removeEventListener("keydown", kd);
  const T = st.map((x, i) => {
    if (x.early) return Infinity;
    let t = x.t === null ? 9 : x.t;
    if (sides[i].winged && !sides[i].perks.has("COLD_NERVE")) t += WINGED_SLOW;
    if (sides[i].perks.has("QUICK_HAND")) t -= QUICK_HAND_S;
    return t;
  });
  st.forEach((x, i) => {                                     // feints resolve: bit → the other false-started
    if (x.feint === "bit") T[1-i] = Infinity;
    else if (x.feint === "pending" && T[i] !== Infinity){ if (!sides[i].perks.has("SELL_IT")) T[i] += FEINT_COST; sides[i].exposed = true; if (i===0) $("zWING").classList.add("open"); }
  });
  if (st[0].early || st[1].early){ sfx.shot(); banner("CRACK —", `${st[0].early ? seatB.name : seatG.name} fired early. into the dirt.`, true); await sleep(TIMING.falseStartCrack); }
  clock(`BOB <b>${fmt(T[0])}</b> &nbsp;—&nbsp; ${gun.char.name} <b>${fmt(T[1])}</b>`);
  return T;
}
// one exchange, two humans. Returns the side that died (or null).
async function twoExchange(eng, bob, gun, seatB, seatG){
  bob.exposed = gun.exposed = false;
  drawMan(gun.char, gun.winged); p2draw(gun.char.name, gun.char.pron, null); setLife(bob, gun);
  const [tb, tg] = await twoDraw(bob, gun, seatB, seatG);
  const bobFirst = tb <= tg;
  const attacker = bobFirst ? bob : gun, reader = bobFirst ? gun : bob;
  const aSeat = bobFirst ? seatB : seatG, rSeat = bobFirst ? seatG : seatB;
  banner(bobFirst ? "BOB IS FIRST" : `${gun.char.name} IS FIRST`, `${aSeat.name} aims — ${rSeat.name} reads`, true);
  const lane = await hiddenLane(aSeat, 1300, `${aSeat.name}: <b>aim</b> (hidden) &nbsp; <small>${aSeat.keysTxt}</small>`);
  if (!lane){ banner("WIDE", `${aSeat.name} never picked a lane`, true); await sleep(TIMING.freeze); $("zWING").classList.remove("open"); return null; }
  prompt(`${aSeat.name} <span class="locked">LOCKED</span>`);
  const tell = eng._tell(attacker, lane, reader);
  if (bobFirst) p2draw(gun.char.name, gun.char.pron, tell, `Bob's eyes: ${EYE_WORD[tell] || "—"}`);
  else drawMan(gun.char, gun.winged, tell, gun.winged ? "winged_draw" : "draw");
  // the honest shoulder, late
  const cueT = setTimeout(() => { if (bobFirst) $("p2cue").textContent += `  ·  ◄══ his arm: ${EYE_WORD[lane]}`;
    else { const z = $("z"+lane); z.classList.add("shoulder"); } sfx.twitch(); }, TIMING.readWindow*TIMING.shoulderAt);
  const read = await hiddenLane(rSeat, TIMING.readWindow, `${rSeat.name}: <b>guard</b> (hidden) — watch the eyes, then the shoulder`);
  clearTimeout(cueT); LANES.forEach(l => $("z"+l).classList.remove("shoulder"));
  attacker.attacks.push(lane); reader.reads.push(read);
  if (!bobFirst){ pose("fire"); } sfx.shot(); await sleep(TIMING.firePose);
  const out = eng._resolve(attacker, lane, read, reader);
  await freeze(lane, read, bobFirst);
  const died = eng._land(reader, out);
  $("zWING").classList.remove("open");
  if (died){ if (reader === gun) dropFoe(); banner(reader === bob ? "BOB IS DOWN" : "KILL", `${aSeat.name} → ${lane} · ${rSeat.name} guarded ${read || "nothing"}`, true); }
  else if (out === WINGED){ sfx.wound(); banner(reader === bob ? "BOB — CRITICAL" : "WINGED", "one more and it's over", true); if (reader === gun) drawMan(gun.char, true); }
  else banner(out === GRAZE && read === lane ? "READ" : "A SCRATCH", "still standing", true);
  setLife(bob, gun); await sleep(TIMING.freeze);
  return died ? reader : null;
}
// one Bangkok volley, two humans: both fire AND guard at once (hidden). Returns [bobDied, gunDied].
async function twoVolley(eng, bob, gun){
  drawMan(gun.char, gun.winged); p2draw(gun.char.name, gun.char.pron, null); setLife(bob, gun);
  for (const c of ["3","2","1"]){ banner("BANGKOK RULES", c, true); await sleep(420); }
  banner("BANG!", "fire, then guard — both at once (hidden)", true);
  const [pb, pg] = await hiddenVolley(1800);
  const [bF, bG] = [pb[0] || null, pb[1] || null], [gF, gG] = [pg[0] || null, pg[1] || null];
  bob.attacks.push(bF); bob.reads.push(bG); gun.attacks.push(gF); gun.reads.push(gG);
  const outB = bF ? eng._resolve(bob, bF, gG, gun) : GRAZE;
  const outG = gF ? eng._resolve(gun, gF, bG, bob) : GRAZE;
  const gunDied = bF ? eng._land(gun, outB) : false;
  const bobDied = gF ? eng._land(bob, outG) : false;
  sfx.shot(); sfx.shot();
  banner(bobDied && gunDied ? "BOTH SHOTS LAND — the house wins" : bobDied ? "BOB IS DOWN" : gunDied ? "KILL" : "BOTH STANDING",
    `P1 fired ${bF||"—"} guarded ${bG||"—"} · P2 fired ${gF||"—"} guarded ${gG||"—"}`, true);
  if (gunDied) dropFoe(); setLife(bob, gun); await sleep(1400);
  return [bobDied, gunDied];
}
// P2's gunman survived: pick 1 of 2 for this gunman (mirrors engine.gunman_perk)
async function twoGunmanPerk(gun, seatG){
  const k = gun.perks.size; if (k >= GUNMAN_PERK_PAIRS.length) return;
  const [a, b] = GUNMAN_PERK_PAIRS[k];
  overlay(`<h1>${seatG.name} — ${gun.char.name} SURVIVED</h1><p class="dim">pick one for this gunman</p>
    <p><span class="k">1</span> <b class="gold">${PERKS[a][0]}</b> — ${PERKS[a][1]}</p><p><span class="k">2</span> <b class="gold">${PERKS[b][0]}</b> — ${PERKS[b][1]}</p>`);
  const pick = await askButtons("", [{ id:"bG1", html:PERKS[a][0], val:a, keys:["Digit1"] }, { id:"bG2", html:PERKS[b][0], val:b, keys:["Digit2"] }]);
  gun.perks.add(pick); if (pick === "SECOND_WIND") gun.winged = false; if (pick === "FLESH_WOUND") gun.flesh = 1;
  hideOverlay(); prompt("");

// the Seven-Johns, two humans: the gunman's seat plays BOTH on one draw.
async function twoPair(eng, bob, j1, j2, seatB, seatG){
  drawPair(j1, j2); setLife(bob, [j1, j2]); p2draw("THE SEVEN-JOHNS", "he", null);
  const [tb, tg] = await twoDraw(bob, { char:{ name:"THE SEVEN-JOHNS" }, winged:false, perks:new Set(), exposed:false }, seatB, seatG);
  const order = tb <= tg ? ["bob","johns"] : ["johns","bob"];
  for (const who of order){
    if (!bob.alive) break;
    if (who === "bob"){
      for (const [j, side] of [[j1,"LEFT"],[j2,"RIGHT"]]){ if (!j.alive) continue;
        const lane = await hiddenLane(seatB, 1100, `${seatB.name}: pull on the <b>${side}</b> John (hidden)`);
        const read = await hiddenLane(seatG, 1100, `${seatG.name}: the ${side} John guards (hidden)`);
        if (!lane) continue;
        const out = eng._resolve(bob, lane, read, j); await freeze(lane, read, true); eng._land(j, out); drawPair(j1, j2); setLife(bob, [j1, j2]); }
    } else {
      for (const [j, side] of [[j1,"LEFT"],[j2,"RIGHT"]]){ if (!j.alive || !bob.alive) continue;
        const lane = await hiddenLane(seatG, 1100, `${seatG.name}: the ${side} John aims (hidden)`);
        if (!lane) continue;
        const tell = eng._tell(j, lane, bob);
        drawPair(j1, j2, j===j1 ? tell : null, j===j2 ? tell : null, j===j1 ? "draw" : null, j===j2 ? "draw" : null);
        const read = await hiddenLane(seatB, TIMING.readWindowPair, `${seatB.name}: guard the <b>${side}</b> John — eyes: <b>${EYE_WORD[tell]}</b>`);
        const out = eng._resolve(j, lane, read, bob); await freeze(lane, read, false); eng._land(bob, out); drawPair(j1, j2); setLife(bob, [j1, j2]); }
    }
  }
  return !bob.alive;
}
// one ROUND: whoever sits in bobSeat plays Bob through the lineup. Returns gunmen beaten.
async function twoRound(bangkok, bobSeat){
  const seatB = SEATS[bobSeat], seatG = SEATS[1-bobSeat];
  const eng = new Engine(Math.floor(Math.random()*1e9));
  const bob = new Side({ ...BOB, tell: BOB_TELL_2P }, new HumanCtl());
  let beaten = 0; p2show(true); setPoem(0); critical(false);
  overlay(`<h1>ROUND — ${seatB.name} IS BOB</h1><p>${seatG.name} plays every gunman. ${bangkok ? "<span class='lethal'>BANGKOK RULES</span> — make or die." : "draw, read, survive."}</p>
    <p class="dim">${seatB.name} (Bob): ${seatB.keysTxt}<br>${seatG.name} (gunmen): ${seatG.keysTxt}</p><div class="start">press any key</div>`);
  await nextKey(() => true); hideOverlay();
  for (let si=0; si<STAGES.length; si++){
    stageStart(bob);
    for (let bi=0; bi<DECISIONS_PER_STAGE; bi++){
      if (si === PAIR_SLOT[0] && bi === PAIR_SLOT[1]){
        const j1 = new Side({ ...SEVEN_JOHN, showboat:true }, new HumanCtl()), j2 = new Side({ ...SEVEN_JOHN_2, showboat:true }, new HumanCtl());
        await playScene("johns");
        if (await twoPair(eng, bob, j1, j2, seatB, seatG)) return beaten;
        beaten++; setPoem(beaten); continue;
      }
      const gun = new Side({ ...LINEUP[si][bi], showboat:true }, new HumanCtl());
      banner(`${gun.char.name}`, `${gun.char.title}${gun.char.pron==="she" ? " — she" : ""}`, true); await sleep(900);
      if (bangkok){
        let over = false;
        for (let x=0; x<BANGKOK_SHOTS; x++){
          const [bDied, gDied] = await twoVolley(eng, bob, gun);
          if (bDied) return beaten;
          if (gDied){ over = true; break; }
          await twoGunmanPerk(gun, seatG);
        }
        if (!over && gun.alive && bob.winged && !gun.winged){ banner("CLOCK'S UP", "the more-wounded man falls", true); await sleep(1200); return beaten; }
      } else {
        for (let x=0; x<BOUT_EXCHANGES; x++){
          const dead = await twoExchange(eng, bob, gun, seatB, seatG);
          if (dead === bob) return beaten;
          if (dead === gun) break;
          await twoGunmanPerk(gun, seatG);
        }
      }
      beaten++; setPoem(beaten);
    }
    // Bob's stage perk (pick by Bob's seat)
    if (bob.perks.has("SECOND_WIND") && bob.winged) bob.winged = false;
    if (si < PERK_PAIRS.length) await perkPick(bob, si);
  }
  return beaten;
}
async function twoPlayer(bangkok){
  window.__twoMode = true;
  const scores = [0, 0];
  for (const bobSeat of [0, 1]){
    scores[bobSeat] = await twoRound(bangkok, bobSeat);
    await playScene("died", { name: `${SEATS[bobSeat].name} as Bob beat ${scores[bobSeat]} of 12` });
  }
  p2show(false); critical(false); window.__twoMode = false;
  const w = scores[0] === scores[1] ? "A DRAW — nobody walks" : `${scores[0] > scores[1] ? "P1" : "P2"} TAKES IT`;
  overlay(`<h1>THE TOURNAMENT</h1><p>P1 as Bob: <b>${scores[0]}</b> gunmen &nbsp;·&nbsp; P2 as Bob: <b>${scores[1]}</b> gunmen</p>
    <h1 class="gold">${w}</h1><div class="start">press any key</div>`);
  await nextKey(() => true); boot();
}
window.__two = { twoPlayer };

    <p><b>Watch the man.</b> His <b>body</b> says <i>when</i> — don't bite on the twitch: fire during <i>steady…</i> and it's a false start.
    His <b>eyes</b> say <i>where</i> — mostly. <span class="k">^ ^</span> high · <span class="k">• •</span> level · <span class="k">v v</span> low.</p>
    <p>On <span class="big gold">DRAW!</span> the crosshair's on his chest — correct and <span class="k">FIRE</span>.
    <span class="k">HEAD</span> = the headshot, the legend. <span class="k">CENTER</span> = the honest kill. <span class="k">WING</span> = a wound — he'll be back.</p>
    <p>His dashed guard drifts to <i>your</i> habit. Break pattern. If he's first: his <b>eyes</b> come early and can lie —
    his <b>shoulder</b> swings late and never does. Guard before the window closes.</p>
    <p class="dim">Fast is fine, but accuracy is everything: the crosshair sways after the draw and settles. The head is small. Pull it wide and you miss.</p>
    <p><span class="k">F</span> during <i>steady…</i> sells your shoulder: if he bites he fires into the dirt and the draw is yours —

    <p>Win the draw and <span class="k">WHOA!</span> lights for an instant — <span class="k">E</span> / right-click to fan the hammer. <span class="gold">DID YOU SEE THAT?</span> = legend; a legend loads the gun.</p>
    <p class="dim">KILL removes him. WING changes him. BLOCK postpones him. 4 stages × 3 + the couplet = 14. You are meant to lose.</p>

  await nextKey(() => true); hideOverlay();
}

// ---- ARCADE GAMEPAD (1-PLAYER) — self-contained poll loop, no engine refactor, no external lib.
// Stick/d-pad/hat VERTICAL -> lane select (UP=HEAD, DOWN=WING, neutral=CENTER) by synthesizing the
// SAME window keydowns the keyboard lanes use (reuses KEYLANE + every kd/nextKey listener).
// Button 0 = FIRE -> synthetic Space (fires the hover AND advances "press any key" beats / coin drop).
const PAD_SEAT = [
  { up:"KeyW", down:"KeyX", center:"KeyS", draw:"ShiftLeft", feint:"KeyQ" },
  { up:"KeyI", down:"KeyM", center:"KeyK", draw:"Enter", feint:"KeyU" },
];
const padSt = [];
const keyCode = code => { try{ window.dispatchEvent(new KeyboardEvent("keydown", { code, key:code, bubbles:true })); }catch(e){} };
function startGamepad(){
  if (startGamepad._on) return; startGamepad._on = true;       // boot() runs every replay — one poll loop, not one per game
  let lastDir = 0, lastFire = false;                                   // edge-detect so we don't spam every frame
  const key = k => { try{ window.dispatchEvent(new KeyboardEvent("keydown", { key:k, code:(k===" "?"Space":k), bubbles:true })); }catch(e){} };
  function poll(){
    try {
      const pads = (navigator.getGamepads ? navigator.getGamepads() : []) || [];
      // 2 PLAYERS: pad 1 = P1's seat, pad 2 = P2's seat (up/down aim, btn3 center, btn0 draw, btn2 feint)
      if (window.__twoMode){
        const live = [...pads].filter(Boolean);
        live.slice(0, 2).forEach((gp, i) => {
          const K = PAD_SEAT[i], G = window.Ghost ? Ghost.read(gp) : { ay:0 }, st = (padSt[i] ||= {});
          const dir = G.ay <= -0.5 ? -1 : G.ay >= 0.5 ? 1 : 0;
          if (dir !== st.dir){ if (dir === -1) keyCode(K.up); else if (dir === 1) keyCode(K.down); st.dir = dir; }
          for (const [b, code] of [[0, K.draw], [3, K.center], [2, K.feint]]){
            const on = !!(window.Ghost ? Ghost.btn(gp, b) : false);
            if (on && !st["b"+b]) keyCode(code); st["b"+b] = on;
          }
        });
        requestAnimationFrame(poll); return;
      }
      let gp = null; for (const p of pads){ if (p){ gp = p; break; } }
      if (gp){
        const DZ = 0.5;
        // VERTICAL fold via the GHOST: it self-calibrates left/right stick, d-pad buttons
        // 12/13 and the POV hat into one deflection (G.ay, up=-1), dead F300 axes filtered out.
        const G = (window.Ghost ? Ghost.read(gp) : { ay:0 });
        const v = G.ay;
        const dir = v <= -DZ ? -1 : (v >= DZ ? 1 : 0);          // UP=HEAD(ArrowUp), DOWN=WING(ArrowDown)
        if (dir !== lastDir){ if (dir === -1) key("ArrowUp"); else if (dir === 1) key("ArrowDown"); lastDir = dir; }
        const fire = !!(window.Ghost ? Ghost.btn(gp, 0) : false);
        const whoaB = !!(window.Ghost ? Ghost.btn(gp, 1) : false);          // button 1 = WHOA!
        if (whoaB && !startGamepad._w) window.dispatchEvent(new KeyboardEvent("keydown", { key:"e", code:"KeyE", bubbles:true }));
        startGamepad._w = whoaB;
        const feintB = !!(window.Ghost ? Ghost.btn(gp, 2) : false);        // button 2 = sell the shoulder (feint)
        if (feintB && !startGamepad._f) window.dispatchEvent(new KeyboardEvent("keydown", { key:"f", code:"KeyF", bubbles:true }));
        startGamepad._f = feintB;
        if (fire && !lastFire) key(" ");                               // rising-edge FIRE / advance / coin
        lastFire = fire;
      }
    } catch(e){}
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);
}

function boot() {
  banner("", ""); prompt(""); clearZones(); setPoem(0);
  startGamepad();
  overlay(`<h1>I THOUGHT YOU WERE DEAD!</h1><div class="credit">a CLEVELAND BOB story</div>
    <p class="dim">Anders &amp; Partners</p><div class="start">INSERT COIN — press any key</div>`);
  nextKey(() => true).then(() => { try{ ac().resume(); }catch(e){} attract(); });   // gesture unlocks audio (mp3 + sfx), then the trailer
}
boot();
